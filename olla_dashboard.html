<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Olla Cluster Dashboard</title>
<style>
:root {
  --bg:      #0d1117;
  --bg2:     #161b22;
  --bg3:     #1c2128;
  --border:  #30363d;
  --text:    #e6edf3;
  --text2:   #8b949e;
  --text3:   #656d76;
  --green:   #3fb950;
  --yellow:  #d29922;
  --red:     #f85149;
  --blue:    #58a6ff;
  --green-bg:  rgba(63,185,80,0.08);
  --yellow-bg: rgba(210,153,34,0.08);
  --red-bg:    rgba(248,81,73,0.08);
  --green-bd:  rgba(63,185,80,0.35);
  --yellow-bd: rgba(210,153,34,0.35);
  --red-bd:    rgba(248,81,73,0.35);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

.mono { font-family: 'SF Mono', 'Cascadia Code', Consolas, 'Liberation Mono', monospace; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* ── Loading overlay ── */
#loading {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 14px; z-index: 1000;
}
.spinner {
  width: 36px; height: 36px;
  border: 3px solid var(--border);
  border-top-color: var(--blue);
  border-radius: 50%;
  animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Status dots ── */
.dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  display: inline-block; flex-shrink: 0;
}
.dot-green  { background: var(--green);  box-shadow: 0 0 5px var(--green); }
.dot-yellow { background: var(--yellow); box-shadow: 0 0 5px var(--yellow); }
.dot-red    { background: var(--red);    box-shadow: 0 0 5px var(--red); }

/* ── Banner ── */
.banner {
  padding: 10px 16px; border-radius: 6px;
  margin: 12px 0; font-size: 13px; display: none;
}
.banner-error { background: var(--red-bg);    border: 1px solid var(--red-bd);    color: var(--red); }
.banner-warn  { background: var(--yellow-bg); border: 1px solid var(--yellow-bd); color: var(--yellow); }

/* ── Header ── */
header {
  border-bottom: 1px solid var(--border);
  padding: 14px 0; background: var(--bg);
  position: sticky; top: 0; z-index: 50;
}
.header-row {
  display: flex; justify-content: space-between;
  align-items: flex-start; gap: 16px;
}
h1 {
  font-size: 16px; font-weight: 700;
  letter-spacing: .06em; text-transform: uppercase;
}
.cluster-status {
  display: flex; align-items: center; gap: 8px;
  margin-top: 5px; flex-wrap: wrap;
}
#status-text   { font-weight: 600; font-size: 15px; }
#status-summary { color: var(--text2); font-size: 13px; }
#last-updated  {
  color: var(--text3); font-size: 12px;
  font-family: 'SF Mono', monospace; white-space: nowrap; margin-top: 2px;
}

/* ── Main layout ── */
main { padding: 20px 0 72px; }
.section { margin-bottom: 28px; }
.section-title {
  font-size: 11px; font-weight: 600;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--text3); margin-bottom: 10px;
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}

/* ── Node grid ── */
.nodes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 12px;
}
.node-card {
  background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; padding: 14px;
}
.card-healthy  { border-color: var(--green-bd);  background: var(--green-bg); }
.card-offline  { border-color: var(--red-bd);    background: var(--red-bg); }
.card-degraded { border-color: var(--yellow-bd); background: var(--yellow-bg); }

.node-head {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 2px;
}
.node-name   { font-weight: 600; font-size: 15px; }
.node-badge  { font-size: 11px; color: var(--text2); margin-bottom: 10px; }
.node-stats  {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 8px 12px; margin-bottom: 10px;
}
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text3); }
.stat-val   { font-size: 13px; font-weight: 500; font-family: 'SF Mono', monospace; }

.load-bar { display: flex; gap: 2px; margin: 2px 0 8px; }
.lb       { height: 6px; flex: 1; border-radius: 2px; background: var(--border); }
.lb.on    { background: var(--blue); }
.no-req   { font-size: 11px; color: var(--text3); font-style: italic; margin-bottom: 8px; }
.node-foot { font-size: 11px; color: var(--text3); }

/* ── Models table ── */
.tbl-wrap { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
thead { background: var(--bg2); }
th {
  padding: 9px 14px; text-align: left;
  font-size: 11px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase;
  color: var(--text3); border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
th[data-col] { cursor: pointer; user-select: none; }
th[data-col]:hover { color: var(--text2); }
th.sort-asc::after  { content: ' ↑'; color: var(--blue); }
th.sort-desc::after { content: ' ↓'; color: var(--blue); }

td { padding: 9px 14px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--bg2); }

.nc {
  font-family: 'SF Mono', monospace; font-size: 12px; font-weight: 600;
  padding: 2px 7px; border-radius: 4px;
}
.nc-g { background: var(--green-bg);  color: var(--green);  border: 1px solid var(--green-bd); }
.nc-y { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow-bd); }
.nc-r { background: var(--red-bg);    color: var(--red);    border: 1px solid var(--red-bd); }

/* ── Log viewer ── */
.log-hdr {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 8px;
}
.log-hdr .section-title { margin: 0; border: none; padding: 0; }
.log-controls { display: flex; align-items: center; gap: 10px; }
.sse-ind { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text2); }

.log-body {
  background: #0a0d10; border: 1px solid var(--border);
  border-radius: 8px; height: 300px; overflow-y: auto;
  padding: 10px;
  font-family: 'SF Mono', 'Cascadia Code', Consolas, monospace;
  font-size: 12px; line-height: 1.65;
}
.ll      { white-space: pre-wrap; word-break: break-all; }
.ll-info { color: var(--text2); }
.ll-warn { color: var(--yellow); }
.ll-err  { color: var(--red); }

/* ── Footer ── */
footer {
  border-top: 1px solid var(--border);
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg); padding: 10px 0; z-index: 50;
}
.footer-row { display: flex; align-items: center; gap: 14px; }
#countdown { color: var(--text3); font-size: 13px; font-family: 'SF Mono', monospace; }

.btn {
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--text); padding: 5px 13px; border-radius: 6px;
  cursor: pointer; font-size: 13px; font-family: inherit;
  transition: background .12s, border-color .12s;
}
.btn:hover { background: var(--bg3); border-color: var(--text3); }

/* ── Responsive ── */
@media (max-width: 600px) {
  .nodes-grid { grid-template-columns: 1fr; }
  .header-row { flex-direction: column; }
}
</style>
</head>
<body>

<!-- Loading overlay (shown only during initial fetch) -->
<div id="loading">
  <div class="spinner"></div>
  <div style="color:var(--text2);font-size:13px">Connecting to Olla&hellip;</div>
</div>

<!-- Sticky header -->
<header>
  <div class="container">
    <div class="header-row">
      <div>
        <h1>Olla Cluster Dashboard</h1>
        <div class="cluster-status">
          <span class="dot dot-green" id="status-dot"></span>
          <span id="status-text">&mdash;</span>
          <span id="status-summary"></span>
        </div>
      </div>
      <div id="last-updated">&mdash;</div>
    </div>
  </div>
</header>

<main>
  <div class="container">

    <!-- Error / warning banner -->
    <div id="banner" class="banner"></div>

    <!-- Nodes -->
    <section class="section">
      <div class="section-title">Nodes</div>
      <div class="nodes-grid" id="nodes-grid">
        <div style="color:var(--text3);font-size:13px">Loading&hellip;</div>
      </div>
    </section>

    <!-- Models -->
    <section class="section">
      <div class="section-title">Models</div>
      <div class="tbl-wrap">
        <table id="models-table">
          <thead>
            <tr>
              <th data-col="name">Name</th>
              <th data-col="family">Family</th>
              <th data-col="size">Size</th>
              <th data-col="params">Params</th>
              <th data-col="quant">Quant</th>
              <th data-col="nodes">Nodes</th>
            </tr>
          </thead>
          <tbody id="models-tbody">
            <tr><td colspan="6" style="color:var(--text3);text-align:center;padding:20px">Loading&hellip;</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <!-- Log viewer -->
    <section class="section">
      <div class="log-hdr">
        <div class="section-title">Logs</div>
        <div class="log-controls">
          <div class="sse-ind">
            <span class="dot dot-red" id="sse-dot"></span>
            <span id="sse-status">Connecting&hellip;</span>
          </div>
          <button class="btn" id="clear-logs-btn">Clear</button>
        </div>
      </div>
      <div class="log-body" id="log-body">
        <div id="log-lines"></div>
      </div>
    </section>

  </div>
</main>

<!-- Sticky footer with refresh controls -->
<footer>
  <div class="container">
    <div class="footer-row">
      <span id="countdown">Refreshing in 30s</span>
      <button class="btn" id="refresh-btn">Refresh Now</button>
    </div>
  </div>
</footer>

<script>
// ─── CONFIG ─────────────────────────────────────────────────────────────────
const OLLA_BASE_URL            = "http://192.168.1.182:8080";   // proxied through FastAPI
const DASHBOARD_BASE           = "http://192.168.1.182:8080";   // FastAPI (logs + proxy)
const REFRESH_INTERVAL_SECONDS = 30;
const LOG_INITIAL_LINES        = 100;
// ────────────────────────────────────────────────────────────────────────────

// ── State ────────────────────────────────────────────────────────────────────
const state = {
  health:      null,
  endpoints:   null,
  models:      null,
  lastUpdated: null,
  error:       null,
  sortCol:     'name',
  sortDir:     'asc',
  sseConnected: false,
  countdown:   REFRESH_INTERVAL_SECONDS,
};

let tickInterval = null;
let sseSource    = null;

// ── Data fetching ─────────────────────────────────────────────────────────────

async function fetchAll() {
  try {
    const [hr, er, mr] = await Promise.all([
      fetch(`${OLLA_BASE_URL}/internal/health`),
      fetch(`${OLLA_BASE_URL}/internal/status/endpoints`),
      fetch(`${OLLA_BASE_URL}/internal/status/models`),
    ]);

    if (!hr.ok || !er.ok || !mr.ok) throw new Error('API returned non-OK status');

    const [health, endpoints, models] = await Promise.all([
      hr.json(), er.json(), mr.json(),
    ]);

    state.health      = health;
    state.endpoints   = endpoints;
    state.models      = models;
    state.lastUpdated = new Date();
    state.error       = null;

  } catch (err) {
    state.error = err;
  }

  renderAll();
  startCountdown();
}

// ── Rendering ─────────────────────────────────────────────────────────────────

function renderAll() {
  renderBanner();
  renderHeader();
  renderNodes();
  renderModels();
}

function renderBanner() {
  const el = document.getElementById('banner');

  if (!state.error) {
    el.style.display = 'none';
    return;
  }

  const msg      = (state.error.message || '').toLowerCase();
  const isFetch  = msg.includes('fetch') || msg.includes('failed') || msg.includes('network');

  if (!state.lastUpdated) {
    // First-load failure
    el.className = 'banner banner-error';
    if (isFetch) {
      el.innerHTML =
        'Olla proxy is not responding. ' +
        '<span style="opacity:.7;font-size:12px">' +
        '(Check browser console — if you see a CORS error, Olla needs to allow requests from this origin.)</span>';
    } else {
      el.textContent = `Error connecting to Olla: ${state.error.message}`;
    }
  } else {
    // Subsequent-refresh failure — keep showing stale data
    el.className   = 'banner banner-warn';
    el.textContent = `Could not reach Olla API — retrying in ${state.countdown}s. Last data from ${fmt(state.lastUpdated)}.`;
  }
  el.style.display = 'block';
}

function renderHeader() {
  if (!state.health && !state.lastUpdated) return;

  if (state.health) {
    const s = state.health.status;
    document.getElementById('status-dot').className  = `dot ${dotClass(s)}`;
    document.getElementById('status-text').textContent = cap(s);
  }

  if (state.endpoints) {
    const e = state.endpoints;
    document.getElementById('status-summary').textContent =
      `${e.healthy_count} of ${e.total_count} nodes healthy · ${e.routable_count} routable`;
  }

  if (state.lastUpdated) {
    document.getElementById('last-updated').textContent = `Last updated: ${fmt(state.lastUpdated)}`;
  }
}

function renderNodes() {
  const grid = document.getElementById('nodes-grid');
  if (!state.endpoints) return;

  const eps   = state.endpoints.endpoints;
  const total = eps.reduce((s, e) => s + (e.request_count || 0), 0);

  grid.innerHTML = eps.map(ep => {
    const sc    = ep.status === 'healthy' ? 'healthy' : ep.status === 'offline' ? 'offline' : 'degraded';
    const ratio = total > 0 ? (ep.request_count || 0) / total : 0;

    let barHtml;
    if (total === 0) {
      barHtml = '<div class="no-req">No requests yet</div>';
    } else {
      const filled = ratio > 0 ? Math.max(1, Math.round(ratio * 10)) : 0;
      const blocks = Array.from({ length: 10 }, (_, i) =>
        `<span class="lb${i < filled ? ' on' : ''}"></span>`
      ).join('');
      barHtml = `<div class="load-bar">${blocks}</div>`;
    }

    return `
<div class="node-card card-${sc}">
  <div class="node-head">
    <span class="node-name">${esc(ep.name)}</span>
    <span class="dot ${dotClass(ep.status)}"></span>
  </div>
  <div class="node-badge">${esc(ep.status)} &middot; ${esc(ep.type)}</div>
  <div class="node-stats">
    <div><div class="stat-label">priority</div><div class="stat-val">${ep.priority}</div></div>
    <div><div class="stat-label">response</div><div class="stat-val">${esc(ep.response_time)}</div></div>
    <div><div class="stat-label">models</div><div class="stat-val">${ep.model_count}</div></div>
    <div><div class="stat-label">requests</div><div class="stat-val">${ep.request_count}</div></div>
  </div>
  ${barHtml}
  <div class="node-foot">checked ${esc(ep.health_check)}</div>
</div>`;
  }).join('');
}

function renderModels() {
  const tbody = document.getElementById('models-tbody');
  if (!state.models) return;

  const totalNodes = state.endpoints
    ? state.endpoints.total_count
    : (state.models.total_endpoints || 1);

  const rows = [...state.models.recent_models].sort((a, b) => {
    let va, vb;
    if (state.sortCol === 'nodes') {
      va = (a.endpoints || []).length;
      vb = (b.endpoints || []).length;
    } else {
      va = (a[state.sortCol] ?? '');
      vb = (b[state.sortCol] ?? '');
      if (typeof va === 'string') { va = va.toLowerCase(); vb = vb.toLowerCase(); }
    }
    if (va < vb) return state.sortDir === 'asc' ? -1 :  1;
    if (va > vb) return state.sortDir === 'asc' ?  1 : -1;
    return 0;
  });

  tbody.innerHTML = rows.map(m => {
    const n   = (m.endpoints || []).length;
    const cls = n >= totalNodes ? 'nc-g' : n <= 1 ? 'nc-r' : 'nc-y';
    return `<tr>
  <td class="mono">${esc(m.name)}</td>
  <td>${esc(m.family)}</td>
  <td class="mono">${esc(m.size)}</td>
  <td class="mono">${esc(m.params)}</td>
  <td class="mono">${esc(m.quant)}</td>
  <td><span class="nc ${cls}">${n}/${totalNodes}</span></td>
</tr>`;
  }).join('');

  // Sync sort-arrow classes
  document.querySelectorAll('#models-table th[data-col]').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === state.sortCol) th.classList.add(`sort-${state.sortDir}`);
  });
}

// ── Countdown & refresh ───────────────────────────────────────────────────────

function startCountdown() {
  if (tickInterval) clearInterval(tickInterval);
  state.countdown = REFRESH_INTERVAL_SECONDS;
  tick();
  tickInterval = setInterval(() => {
    state.countdown--;
    tick();
    if (state.error) renderBanner();   // keep countdown in warning banner in sync
    if (state.countdown <= 0) {
      clearInterval(tickInterval);
      fetchAll();
    }
  }, 1000);
}

function tick() {
  document.getElementById('countdown').textContent = `Refreshing in ${state.countdown}s`;
}

// ── SSE log streaming ─────────────────────────────────────────────────────────

function connectSSE() {
  if (sseSource) { sseSource.close(); sseSource = null; }

  sseSource = new EventSource(`${DASHBOARD_BASE}/logs/stream`);

  sseSource.onopen = () => {
    state.sseConnected = true;
    updateSSEStatus();
  };

  sseSource.onmessage = e => {
    if (!e.data) return;
    appendLog(e.data);
    if (!state.sseConnected) { state.sseConnected = true; updateSSEStatus(); }
  };

  sseSource.onerror = () => {
    state.sseConnected = false;
    updateSSEStatus();
    sseSource.close();
    sseSource = null;
    setTimeout(connectSSE, 5000);
  };
}

function appendLog(line) {
  const container = document.getElementById('log-lines');
  const logBody   = document.getElementById('log-body');
  const atBottom  = logBody.scrollHeight - logBody.scrollTop - logBody.clientHeight < 60;

  const el        = document.createElement('div');
  el.className    = `ll ${logLevel(line)}`;
  el.textContent  = line;
  container.appendChild(el);

  while (container.children.length > 500) container.removeChild(container.firstChild);

  if (atBottom) logBody.scrollTop = logBody.scrollHeight;
}

function logLevel(line) {
  if (/\b(ERROR|ERR|FATAL|CRIT)\b/i.test(line)) return 'll-err';
  if (/\b(WARN|WARNING)\b/i.test(line))           return 'll-warn';
  return 'll-info';
}

function updateSSEStatus() {
  const dot  = document.getElementById('sse-dot');
  const text = document.getElementById('sse-status');
  if (state.sseConnected) {
    dot.className   = 'dot dot-green';
    text.textContent = 'Live';
  } else {
    dot.className   = 'dot dot-red';
    text.textContent = 'Reconnecting…';
  }
}

async function loadInitialLogs() {
  try {
    const res = await fetch(`${DASHBOARD_BASE}/logs/recent?lines=${LOG_INITIAL_LINES}`);
    if (!res.ok) return;
    const data = await res.json();
    (data.lines || []).forEach(appendLog);
    const lb = document.getElementById('log-body');
    lb.scrollTop = lb.scrollHeight;
  } catch { /* silent — SSE will deliver logs */ }
}

// ── Utilities ─────────────────────────────────────────────────────────────────

function dotClass(status) {
  if (status === 'healthy') return 'dot-green';
  if (status === 'offline') return 'dot-red';
  return 'dot-yellow';
}

function cap(s) {
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
}

function fmt(d) {
  return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

function esc(s) {
  return String(s ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Event wiring ──────────────────────────────────────────────────────────────

document.getElementById('refresh-btn').addEventListener('click', () => {
  if (tickInterval) clearInterval(tickInterval);
  fetchAll();
});

document.getElementById('clear-logs-btn').addEventListener('click', () => {
  document.getElementById('log-lines').innerHTML = '';
});

document.querySelectorAll('#models-table th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    if (state.sortCol === th.dataset.col) {
      state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      state.sortCol = th.dataset.col;
      state.sortDir = 'asc';
    }
    renderModels();
  });
});

// ── Boot ──────────────────────────────────────────────────────────────────────

async function init() {
  await fetchAll();
  document.getElementById('loading').style.display = 'none';
  await loadInitialLogs();
  connectSSE();
}

init();
</script>
</body>
</html>
